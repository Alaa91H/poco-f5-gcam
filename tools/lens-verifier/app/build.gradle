plugins {
    id "com.android.application"
}

android {
    namespace "dev.alaa.pocof5.lensverifier"
    compileSdk 37

    defaultConfig {
        applicationId "dev.alaa.pocof5.lensverifier"
        minSdk 23
        targetSdk 37
        versionCode 1
        versionName "0.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}