plugins {
    id "com.android.application"
}

def probeApplicationId = providers.gradleProperty("probeApplicationId")
        .getOrElse("dev.alaa.pocof5.camera2probe")

android {
    namespace "dev.alaa.pocof5.camera2probe"
    compileSdk 37

    defaultConfig {
        applicationId probeApplicationId
        minSdk 23
        targetSdk 37
        versionCode 1
        // Keep this in sync with scripts/run-camera2-probe.ps1.
        versionName "0.4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
