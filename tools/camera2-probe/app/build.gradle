plugins {
    id "com.android.application"
}

def probeApplicationId = providers.gradleProperty("probeApplicationId")
        .getOrElse("dev.alaa.pocof5.camera2probe")

android {
    namespace "dev.alaa.pocof5.camera2probe"
    compileSdk 35

    defaultConfig {
        applicationId probeApplicationId
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
