name: Unified build and validation

on:
  push:
    paths:
      - "tools/camera2-probe/**"
      - "tools/lens-verifier/**"
      - "scripts/**"
      - "tests/test_resolve_apkmirror_gcam.py"
      - "tests/test_download_latest_pixel_camera.py"
      - "tests/test_inspect_apkm.py"
      - "device/marble/upstream-policy.json"
      - "device/marble/apkm-audit-policy.json"
      - "device/marble/upstream/pixel-camera.json"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "tools/camera2-probe/**"
      - "tools/lens-verifier/**"
      - "scripts/**"
      - "tests/test_resolve_apkmirror_gcam.py"
      - "tests/test_download_latest_pixel_camera.py"
      - "tests/test_inspect_apkm.py"
      - "device/marble/upstream-policy.json"
      - "device/marble/apkm-audit-policy.json"
      - "device/marble/upstream/pixel-camera.json"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected components
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      powershell: ${{ steps.filter.outputs.powershell }}
      upstream: ${{ steps.filter.outputs.upstream }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$BEFORE_SHA"
          fi

          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          else
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          fi

          printf '%s\n' "$CHANGED_FILES"

          android=false
          powershell=false
          upstream=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              tools/camera2-probe/*|tools/lens-verifier/*|.github/workflows/build.yml)
                android=true
                ;;
            esac

            case "$file" in
              scripts/*|.github/workflows/build.yml)
                powershell=true
                ;;
            esac

            case "$file" in
              scripts/resolve_apkmirror_gcam.py|scripts/download_latest_pixel_camera.py|scripts/inspect_apkm.py|tests/test_resolve_apkmirror_gcam.py|tests/test_download_latest_pixel_camera.py|tests/test_inspect_apkm.py|device/marble/upstream-policy.json|device/marble/apkm-audit-policy.json|device/marble/upstream/pixel-camera.json|.github/workflows/build.yml)
                upstream=true
                ;;
            esac
          done <<< "$CHANGED_FILES"

          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "powershell=$powershell" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"

          {
            echo "### Affected components"
            echo ""
            echo "- Android tools: `$android`"
            echo "- PowerShell tooling: `$powershell`"
            echo "- Pixel Camera upstream: `$upstream`"
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Build ${{ matrix.name }}
    needs: changes
    if: >-
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (needs.changes.result == 'success' && needs.changes.outputs.android == 'true')
      )
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Camera2 probe
            id: camera2-probe
            project: tools/camera2-probe
            artifact: camera2-probe-debug
          - name: Lens verifier
            id: lens-verifier
            project: tools/lens-verifier
            artifact: lens-verifier-debug

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          fi

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" --channel=3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Build and lint
        shell: bash
        run: |
          gradle -p "${{ matrix.project }}" :app:assembleDebug :app:lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.project }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Send Camera2 probe APK to Telegram
        if: matrix.id == 'camera2-probe' && github.event_name != 'pull_request'
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          APK_PATH="${{ matrix.project }}/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            exit 1
          fi

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::warning::Telegram delivery skipped because TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured."
            exit 0
          fi

          CAPTION="$(printf '✅ Build succeeded\nRepository: %s\nBranch: %s\nCommit: %s' \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_REF_NAME" \
            "${GITHUB_SHA:0:7}")"

          if curl --silent --show-error --fail-with-body --retry 3 \
            --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form "chat_id=${TELEGRAM_CHAT_ID}" \
            --form "document=@${APK_PATH};type=application/vnd.android.package-archive" \
            --form "caption=${CAPTION}"; then
            echo "APK sent to Telegram successfully."
          else
            echo "::warning::Telegram delivery failed; keeping the successful build and continuing CI."
          fi

      - name: Verify Camera2 custom package build
        if: matrix.id == 'camera2-probe'
        shell: bash
        run: |
          gradle -p "${{ matrix.project }}" :app:assembleDebug \
            -PprobeApplicationId=dev.alaa.pocof5.camera2probe.compatcheck \
            --stacktrace

  powershell:
    name: Validate PowerShell tooling
    needs: changes
    if: >-
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (needs.changes.result == 'success' && needs.changes.outputs.powershell == 'true')
      )
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Parse all PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false

          Get-ChildItem -Path (Join-Path $PWD "scripts") -Filter "*.ps1" -File -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null

            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($parseError in $errors) {
                Write-Error ("{0}:{1}:{2}: {3}" -f $_.FullName, $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.Message)
              }
            }
            else {
              Write-Host ("PASS: {0}" -f $_.FullName)
            }
          }

          if ($failed) {
            exit 1
          }

          Write-Host "All PowerShell scripts passed syntax validation."

  upstream:
    name: Refresh latest compatible Pixel Camera
    needs: changes
    if: >-
      always() &&
      (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (needs.changes.result == 'success' && needs.changes.outputs.upstream == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run resolver and downloader tests
        run: |
          python -m unittest tests.test_resolve_apkmirror_gcam -v
          python -m unittest tests.test_download_latest_pixel_camera -v
          python -m unittest tests.test_inspect_apkm -v

      - name: Resolve newest compatible Pixel Camera
        if: github.event_name != 'pull_request'
        run: |
          python scripts/resolve_apkmirror_gcam.py \
            --policy device/marble/upstream-policy.json \
            --output device/marble/upstream/pixel-camera.json

      - name: Read selected release state
        id: selected
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("device/marble/upstream/pixel-camera.json").read_text())
          print(data["selected"]["version"])
          PY
          )"

          if git diff --quiet -- device/marble/upstream/pixel-camera.json; then
            CHANGED=false
          else
            CHANGED=true
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

          {
            echo "### Pixel Camera selection"
            echo ""
            echo "- Version: `$VERSION`"
            echo "- Target: Android 17 / API 37, arm64-v8a, nodpi"
            echo "- Selection changed: `$CHANGED`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live APKMirror download path
        run: |
          python scripts/download_latest_pixel_camera.py \
            --lock device/marble/upstream/pixel-camera.json \
            --resolve-only \
            --json

      - name: Download latest compatible Pixel Camera
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref == 'test/real-e2e-telegram-delivery') ||
          (github.event_name == 'schedule' && steps.selected.outputs.changed == 'true')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pixel-camera"

          python scripts/download_latest_pixel_camera.py \
            --lock device/marble/upstream/pixel-camera.json \
            --output-dir "$RUNNER_TEMP/pixel-camera" \
            --json | tee "$RUNNER_TEMP/pixel-camera-download.json"

          echo "Downloaded files:"
          ls -lh "$RUNNER_TEMP/pixel-camera"

          {
            echo ""
            echo "### Download"
            echo ""
            echo "Latest compatible Pixel Camera was downloaded and SHA-256 verified on the ephemeral GitHub runner."
            echo "The proprietary APK/APKM is not committed to this repository."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install APK signature verifier
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref == 'test/real-e2e-telegram-delivery') ||
          (github.event_name == 'schedule' && steps.selected.outputs.changed == 'true')
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Audit downloaded Pixel Camera bundle
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref == 'test/real-e2e-telegram-delivery') ||
          (github.event_name == 'schedule' && steps.selected.outputs.changed == 'true')
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_PATH="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/pixel-camera-download.json"))["path"])')"
          EXPECTED_SIGNER="$(python -c 'import json; print(json.load(open("device/marble/apkm-audit-policy.json"))["allowed_signer_sha256"][0])')"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          REPORT="$RUNNER_TEMP/pixel-camera-audit.json"

          python scripts/inspect_apkm.py "$PACKAGE_PATH" \
            --output "$REPORT" \
            --apksigner "$APKSIGNER" \
            --allowed-signer-sha256 "$EXPECTED_SIGNER" \
            --require-signature-verification >/dev/null

          python -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/pixel-camera-audit.json")); s=r["summary"]; sig=s["signature"]; out=open(os.environ["GITHUB_STEP_SUMMARY"],"a"); out.write("\\n### Pixel Camera APKM audit\\n\\n"); out.write("- APK/split count: %s\\n" % s["apk_count"]); out.write("- PairIP indicators: %s\\n" % s["pairip_detected"]); out.write("- All APK signatures verified: %s\\n" % sig["all_verified"]); out.write("- Consistent signer: %s\\n" % sig["consistent_signer"]); out.close()'

      - name: Prepare official Telegram Bot API source
        id: telegram-source
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref == 'test/real-e2e-telegram-delivery')
        shell: bash
        run: |
          set -euo pipefail

          SRC="$RUNNER_TEMP/telegram-bot-api-src"
          rm -rf "$SRC"
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/tdlib/telegram-bot-api.git "$SRC"

          SOURCE_SHA="$(git -C "$SRC" rev-parse HEAD)"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Telegram Bot API source: $SOURCE_SHA"

      - name: Restore Telegram Bot API binary cache
        id: telegram-cache
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref == 'test/real-e2e-telegram-delivery')
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/telegram-bot-api-bin
          key: telegram-bot-api-${{ runner.os }}-${{ steps.telegram-source.outputs.sha }}

      - name: Build official Telegram Local Bot API server
        if: >-
          (
            github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref == 'test/real-e2e-telegram-delivery')
          ) &&
          steps.telegram-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gperf libssl-dev zlib1g-dev

          SRC="$RUNNER_TEMP/telegram-bot-api-src"
          BIN_DIR="$RUNNER_TEMP/telegram-bot-api-bin"
          rm -rf "$SRC/build"
          mkdir -p "$BIN_DIR"

          cmake -S "$SRC" -B "$SRC/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$SRC/build" --target telegram-bot-api --parallel "$(nproc)"

          BIN="$(find "$SRC/build" -type f -name telegram-bot-api -perm -111 -print -quit)"
          if [ -z "$BIN" ] || [ ! -x "$BIN" ]; then
            echo "::error::telegram-bot-api binary was not produced."
            exit 1
          fi

          install -m 0755 "$BIN" "$BIN_DIR/telegram-bot-api"

      - name: Save Telegram Bot API binary cache
        if: >-
          (
            github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref == 'test/real-e2e-telegram-delivery')
          ) &&
          steps.telegram-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/telegram-bot-api-bin
          key: telegram-bot-api-${{ runner.os }}-${{ steps.telegram-source.outputs.sha }}

      - name: Select Telegram Bot API binary
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref == 'test/real-e2e-telegram-delivery')
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.telegram-source.outputs.sha }}
        run: |
          set -euo pipefail

          BIN="$RUNNER_TEMP/telegram-bot-api-bin/telegram-bot-api"
          if [ ! -x "$BIN" ]; then
            echo "::error::Cached/built telegram-bot-api binary is missing."
            exit 1
          fi

          echo "TELEGRAM_BOT_API_BIN=$BIN" >> "$GITHUB_ENV"
          echo "TELEGRAM_BOT_API_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Deliver original Pixel Camera file through Local Bot API
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref == 'test/real-e2e-telegram-delivery')
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail

          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID TELEGRAM_API_ID TELEGRAM_API_HASH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required repository secret $name is not configured."
              exit 1
            fi
          done

          # GitHub Secrets can accidentally include a trailing newline or
          # surrounding whitespace when values are pasted into repository settings.
          TELEGRAM_BOT_TOKEN="$(printf '%s' "$TELEGRAM_BOT_TOKEN" | tr -d '\r\n')"
          TELEGRAM_CHAT_ID="$(printf '%s' "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')"
          TELEGRAM_API_ID="$(printf '%s' "$TELEGRAM_API_ID" | tr -d '[:space:]')"
          TELEGRAM_API_HASH="$(printf '%s' "$TELEGRAM_API_HASH" | tr -d '[:space:]')"
          export TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID TELEGRAM_API_ID TELEGRAM_API_HASH

          if ! [[ "$TELEGRAM_API_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::TELEGRAM_API_ID must contain digits only after whitespace is removed."
            exit 1
          fi

          if ! [[ "$TELEGRAM_API_HASH" =~ ^[0-9A-Fa-f]{32}$ ]]; then
            echo "::error::TELEGRAM_API_HASH must be the 32-character hexadecimal api_hash from my.telegram.org."
            exit 1
          fi

          META="$RUNNER_TEMP/pixel-camera-download.json"
          PACKAGE_PATH="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' "$META")"
          VERSION="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$META")"
          SIZE="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["size_bytes"])' "$META")"
          SHA256="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$META")"
          PACKAGE_NAME="$(basename "$PACKAGE_PATH")"

          if [ ! -f "$PACKAGE_PATH" ]; then
            echo "::error::Downloaded Pixel Camera payload not found: $PACKAGE_PATH"
            exit 1
          fi

          ACTUAL_SIZE="$(stat -c '%s' "$PACKAGE_PATH")"
          ACTUAL_SHA256="$(sha256sum "$PACKAGE_PATH" | awk '{print $1}')"
          [ "$ACTUAL_SIZE" = "$SIZE" ] || {
            echo "::error::Payload size changed before Telegram delivery."
            exit 1
          }
          [ "$ACTUAL_SHA256" = "$SHA256" ] || {
            echo "::error::Payload SHA-256 changed before Telegram delivery."
            exit 1
          }

          # Required by Telegram when moving a bot from the cloud Bot API to a
          # local Bot API server. Failure here is tolerated only because a bot
          # may already be logged out from the cloud after a previous test.
          curl --silent --show-error --max-time 30 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/logOut" \
            > "$RUNNER_TEMP/telegram-cloud-logout.json" || true

          RUNTIME="$RUNNER_TEMP/telegram-bot-api-runtime"
          mkdir -p "$RUNTIME"
          cd "$RUNTIME"

          "$TELEGRAM_BOT_API_BIN" \
            --api-id="$TELEGRAM_API_ID" \
            --api-hash="$TELEGRAM_API_HASH" \
            --local \
            --http-ip-address=127.0.0.1 \
            --http-port=8081 \
            > "$RUNNER_TEMP/telegram-bot-api.log" 2>&1 &
          TG_PID=$!

          cleanup() {
            curl --silent --max-time 15 \
              "http://127.0.0.1:8081/bot${TELEGRAM_BOT_TOKEN}/logOut" \
              >/dev/null 2>&1 || true
            kill "$TG_PID" >/dev/null 2>&1 || true
            wait "$TG_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          READY=false
          for attempt in $(seq 1 90); do
            if ! kill -0 "$TG_PID" >/dev/null 2>&1; then
              echo "::error::Telegram Bot API server exited before becoming ready."
              cat "$RUNNER_TEMP/telegram-bot-api.log" || true
              exit 1
            fi

            if curl --silent --show-error --max-time 5 \
              "http://127.0.0.1:8081/bot${TELEGRAM_BOT_TOKEN}/getMe" \
              > "$RUNNER_TEMP/telegram-getme.json"; then
              if python - "$RUNNER_TEMP/telegram-getme.json" <<'PY'
          import json
          import sys
          try:
              response = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if response.get("ok") is True else 1)
          PY
              then
                READY=true
                break
              fi
            fi
            sleep 1
          done

          if [ "$READY" != true ]; then
            echo "::error::Telegram Local Bot API did not become ready."
            cat "$RUNNER_TEMP/telegram-bot-api.log" || true
            exit 1
          fi

          CAPTION="$(printf '✅ Pixel Camera E2E\nVersion: %s\nSize: %s bytes\nSHA-256: %s' "$VERSION" "$SIZE" "$SHA256")"

          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-all-errors --max-time 1800 \
            --request POST \
            --url "http://127.0.0.1:8081/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form "chat_id=${TELEGRAM_CHAT_ID}" \
            --form "document=@${PACKAGE_PATH};type=application/octet-stream" \
            --form-string "caption=${CAPTION}" \
            > "$RUNNER_TEMP/telegram-send-response.json"

          python - "$RUNNER_TEMP/telegram-send-response.json" "$SIZE" "$PACKAGE_NAME" <<'PY'
          import json
          import sys

          response = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_size = int(sys.argv[2])
          expected_name = sys.argv[3]

          if response.get("ok") is not True:
              raise SystemExit(f"Telegram rejected the document: {response}")

          document = response.get("result", {}).get("document") or {}
          delivered_size = document.get("file_size")
          delivered_name = document.get("file_name")

          if delivered_size is not None and int(delivered_size) != expected_size:
              raise SystemExit(
                  f"Telegram file size mismatch: expected {expected_size}, got {delivered_size}"
              )
          if delivered_name and delivered_name != expected_name:
              raise SystemExit(
                  f"Telegram file name mismatch: expected {expected_name}, got {delivered_name}"
              )

          print(f"Telegram accepted one document: {delivered_name or expected_name}")
          print(f"Telegram reported size: {delivered_size or expected_size} bytes")
          PY

          {
            echo ""
            echo "### Telegram Local Bot API E2E"
            echo ""
            echo "- Delivery: one original file (no splitting)"
            echo "- File: `$PACKAGE_NAME`"
            echo "- Size: `$SIZE bytes`"
            echo "- SHA-256: `$SHA256`"
            echo "- Local Bot API source: `$TELEGRAM_BOT_API_SOURCE_SHA`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pixel Camera audit report
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' && github.head_ref == 'test/real-e2e-telegram-delivery') ||
          (github.event_name == 'schedule' && steps.selected.outputs.changed == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: pixel-camera-audit-${{ steps.selected.outputs.version }}
          path: ${{ runner.temp }}/pixel-camera-audit.json
          if-no-files-found: error

      - name: Commit selected-version lock update
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- device/marble/upstream/pixel-camera.json; then
            echo "Already tracking the newest compatible Pixel Camera."
            exit 0
          fi

          VERSION="${{ steps.selected.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add device/marble/upstream/pixel-camera.json
          git commit -m "chore(upstream): select Pixel Camera ${VERSION}"
          git push
