name: Build, validate and deliver POCO F5 camera flavours

on:
  push:
    branches:
      - main
    paths:
      - "tools/camera2-probe/**"
      - "tools/lens-verifier/**"
      - "tools/OpenClManifestPatcher.java"
      - "scripts/**"
      - "tests/test_resolve_apkmirror_gcam.py"
      - "tests/test_download_latest_pixel_camera.py"
      - "tests/test_inspect_apkm.py"
      - "tests/test_build_standalone_pixel_camera.py"
      - "tests/test_patch_pixel_camera_device_gate.py"
      - "tests/test_patch_pixel_camera_opencl_guard.py"
      - "tests/test_gcam_init_obfuscation.py"
      - "tests/test_native_patch_profiles.py"
      - "tests/test_patch_pixel_camera_raw_session.py"
      - "tests/test_pixel_camera_111_port.py"
      - "scripts/patch_pixel_camera_raw_session.py"
      - "scripts/patch_pixel_camera_manual_controls.py"
      - "scripts/pixel_camera_111_port.py"
      - "tools/MergeCompatibilityDex.java"
      - "tests/test_pixel_camera_session_identity.py"
      - "tests/test_analyze_pixel_camera_native.py"
      - "tests/test_plan_device_splits.py"
      - "device/marble/upstream-policy.json"
      - "device/marble/standalone-apk-policy.json"
      - "device/marble/build-flavors.json"
      - "device/marble/apkm-audit-policy.json"
      - "device/marble/upstream/pixel-camera.json"
      - "scripts/build_flavor_matrix.py"
      - "scripts/send_telegram_deliverables.py"
      - "tests/test_build_flavor_matrix.py"
      - "tests/test_patch_pixel_camera_manual_controls.py"
      - "tests/test_send_telegram_deliverables.py"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "tools/camera2-probe/**"
      - "tools/lens-verifier/**"
      - "tools/OpenClManifestPatcher.java"
      - "scripts/**"
      - "tests/test_resolve_apkmirror_gcam.py"
      - "tests/test_download_latest_pixel_camera.py"
      - "tests/test_inspect_apkm.py"
      - "tests/test_build_standalone_pixel_camera.py"
      - "tests/test_patch_pixel_camera_device_gate.py"
      - "tests/test_patch_pixel_camera_opencl_guard.py"
      - "tests/test_gcam_init_obfuscation.py"
      - "tests/test_native_patch_profiles.py"
      - "tests/test_patch_pixel_camera_raw_session.py"
      - "tests/test_pixel_camera_111_port.py"
      - "scripts/patch_pixel_camera_raw_session.py"
      - "scripts/patch_pixel_camera_manual_controls.py"
      - "scripts/pixel_camera_111_port.py"
      - "tools/MergeCompatibilityDex.java"
      - "tests/test_pixel_camera_session_identity.py"
      - "tests/test_plan_device_splits.py"
      - "device/marble/upstream-policy.json"
      - "device/marble/standalone-apk-policy.json"
      - "device/marble/build-flavors.json"
      - "device/marble/apkm-audit-policy.json"
      - "device/marble/upstream/pixel-camera.json"
      - "scripts/build_flavor_matrix.py"
      - "scripts/send_telegram_deliverables.py"
      - "tests/test_build_flavor_matrix.py"
      - "tests/test_patch_pixel_camera_manual_controls.py"
      - "tests/test_send_telegram_deliverables.py"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      build_experimental_standalone:
        description: "Build the four camera flavour APKs and send them to Telegram on main (device validation required)"
        required: false
        type: boolean
        default: true
      deliver_flavors:
        description: "Optional comma-separated flavour IDs to deliver (blank sends all four)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: unified-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected components
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    outputs:
      android: ${{ steps.filter.outputs.android }}
      powershell: ${{ steps.filter.outputs.powershell }}
      upstream: ${{ steps.filter.outputs.upstream }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$BEFORE_SHA"
          fi

          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          else
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
          fi

          printf '%s\n' "$CHANGED_FILES"

          android=false
          powershell=false
          upstream=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            case "$file" in
              tools/camera2-probe/*|tools/lens-verifier/*|scripts/run-camera2-probe.ps1|.github/workflows/build.yml)
                android=true
                ;;
            esac

            case "$file" in
              scripts/*|.github/workflows/build.yml)
                powershell=true
                ;;
            esac

            case "$file" in
              tools/OpenClManifestPatcher.java|tools/MergeCompatibilityDex.java|scripts/resolve_apkmirror_gcam.py|scripts/download_latest_pixel_camera.py|scripts/inspect_apkm.py|scripts/plan_device_splits.py|scripts/patch_pixel_camera_device_gate.py|scripts/patch_pixel_camera_opencl_guard.py|scripts/analyze_pixel_camera_native.py|scripts/build_standalone_pixel_camera.py|scripts/pixel_camera_111_port.py|tests/test_resolve_apkmirror_gcam.py|tests/test_download_latest_pixel_camera.py|tests/test_inspect_apkm.py|tests/test_plan_device_splits.py|tests/test_build_standalone_pixel_camera.py|tests/test_patch_pixel_camera_device_gate.py|tests/test_patch_pixel_camera_opencl_guard.py|tests/test_gcam_init_obfuscation.py|tests/test_native_patch_profiles.py|tests/test_patch_pixel_camera_raw_session.py|tests/test_pixel_camera_111_port.py|scripts/patch_pixel_camera_raw_session.py|tests/test_pixel_camera_session_identity.py|tests/test_analyze_pixel_camera_native.py|device/marble/upstream-policy.json|device/marble/apkm-audit-policy.json|device/marble/standalone-apk-policy.json|device/marble/build-flavors.json|device/marble/upstream/pixel-camera.json|scripts/build_flavor_matrix.py|scripts/patch_pixel_camera_manual_controls.py|scripts/send_telegram_deliverables.py|tests/test_build_flavor_matrix.py|tests/test_patch_pixel_camera_manual_controls.py|tests/test_send_telegram_deliverables.py|.github/workflows/build.yml)
                upstream=true
                ;;
            esac
          done <<< "$CHANGED_FILES"

          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "powershell=$powershell" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"

          {
            echo "### Affected components"
            echo ""
            echo "- Android tools: `$android`"
            echo "- PowerShell tooling: `$powershell`"
            echo "- Pixel Camera upstream: `$upstream`"
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Build ${{ matrix.name }}
    needs: changes
    if: >-
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (needs.changes.result == 'success' && needs.changes.outputs.android == 'true')
      )
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Camera2 probe
            id: camera2-probe
            project: tools/camera2-probe
            artifact: camera2-probe-debug
          - name: Lens verifier
            id: lens-verifier
            project: tools/lens-verifier
            artifact: lens-verifier-debug

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          fi

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" --channel=3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Build and lint
        shell: bash
        run: |
          gradle -p "${{ matrix.project }}" :app:assembleDebug :app:lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.project }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      - name: Verify Camera2 custom package build
        if: matrix.id == 'camera2-probe'
        shell: bash
        run: |
          gradle -p "${{ matrix.project }}" :app:assembleDebug \
            -PprobeApplicationId=dev.alaa.pocof5.camera2probe.compatcheck \
            --stacktrace

  powershell:
    name: Validate PowerShell tooling
    needs: changes
    if: >-
      always() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (needs.changes.result == 'success' && needs.changes.outputs.powershell == 'true')
      )
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Parse all PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false

          Get-ChildItem -Path (Join-Path $PWD "scripts") -Filter "*.ps1" -File -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null

            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($parseError in $errors) {
                Write-Error ("{0}:{1}:{2}: {3}" -f $_.FullName, $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.Message)
              }
            }
            else {
              Write-Host ("PASS: {0}" -f $_.FullName)
            }
          }

          if ($failed) {
            exit 1
          }

          Write-Host "All PowerShell scripts passed syntax validation."

  upstream:
    name: Refresh Pixel Camera and build camera flavours
    needs: changes
    if: >-
      always() &&
      (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (needs.changes.result == 'success' && needs.changes.outputs.upstream == 'true')
      )
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up JDK 17 for manifest tooling
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Pixel Camera pipeline tests
        run: |
          python -m unittest tests.test_resolve_apkmirror_gcam -v
          python -m unittest tests.test_download_latest_pixel_camera -v
          python -m unittest tests.test_inspect_apkm -v
          python -m unittest tests.test_plan_device_splits -v
          python -m unittest tests.test_build_standalone_pixel_camera -v
          python -m unittest tests.test_patch_pixel_camera_device_gate -v
          python -m unittest tests.test_pixel_camera_111_port -v
          python -m unittest tests.test_patch_pixel_camera_opencl_guard tests.test_pixel_camera_session_identity tests.test_gcam_init_obfuscation tests.test_native_patch_profiles tests.test_patch_pixel_camera_raw_session -v
          python -m unittest tests.test_analyze_pixel_camera_native -v
          python -m unittest tests.test_build_flavor_matrix tests.test_patch_pixel_camera_manual_controls tests.test_send_telegram_deliverables -v

      - name: Resolve newest compatible Pixel Camera
        if: github.event_name != 'pull_request'
        run: |
          python scripts/resolve_apkmirror_gcam.py \
            --policy device/marble/upstream-policy.json \
            --output device/marble/upstream/pixel-camera.json

      - name: Read selected release state
        id: selected
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("device/marble/upstream/pixel-camera.json").read_text())
          print(data["selected"]["version"])
          PY
          )"

          if git diff --quiet -- device/marble/upstream/pixel-camera.json; then
            CHANGED=false
          else
            CHANGED=true
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

          {
            echo "### Pixel Camera selection"
            echo ""
            printf -- '- Version: `%s`\n' "$VERSION"
            echo "- Upstream target: Android 17 / API 37, arm64-v8a, nodpi"
            echo "- Flavour matrix: Pixel Camera 11.1 Android 17+ and Android 13+, each with a normal and a manual-controls variant"
            printf -- '- Selection changed: `%s`\n' "$CHANGED"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decide standalone compatibility build
        id: standalone
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_AFFECTED: ${{ needs.changes.outputs.upstream }}
          DISPATCH_STANDALONE: ${{ inputs.build_experimental_standalone }}
        run: |
          set -euo pipefail

          ENABLED=false
          if [ "$EVENT_NAME" = "push" ] && [ "$UPSTREAM_AFFECTED" = "true" ]; then
            ENABLED=true
          elif [ "$EVENT_NAME" = "schedule" ]; then
            ENABLED=true
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_STANDALONE" = "true" ]; then
            ENABLED=true
          fi

          echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
          echo "- Build four camera flavour APKs: `$ENABLED`" >> "$GITHUB_STEP_SUMMARY"

      - name: Free hosted-runner disk space
        if: >-
          steps.standalone.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/sources \
            /usr/local/lib/android/sdk/docs \
            /usr/local/lib/android/sdk/samples \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/chromium \
            /usr/local/.ghcup \
            /opt/google/chrome \
            /usr/share/swift \
            /usr/share/gradle \
            /usr/local/gradle
          df -h

      - name: Verify live APKMirror download path
        run: |
          python scripts/download_latest_pixel_camera.py \
            --lock device/marble/upstream/pixel-camera.json \
            --resolve-only \
            --json

      - name: Download latest compatible Pixel Camera
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.standalone.outputs.enabled == 'true' ||
          (github.event_name == 'schedule' && steps.selected.outputs.changed == 'true')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pixel-camera"

          python scripts/download_latest_pixel_camera.py \
            --lock device/marble/upstream/pixel-camera.json \
            --output-dir "$RUNNER_TEMP/pixel-camera" \
            --json | tee "$RUNNER_TEMP/pixel-camera-download.json"

          echo "Downloaded files:"
          ls -lh "$RUNNER_TEMP/pixel-camera"

          PACKAGE_PATH="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/pixel-camera-download.json"))["path"])')"
          echo "PIXEL_CAMERA_SOURCE=$PACKAGE_PATH" >> "$GITHUB_ENV"

          {
            echo ""
            echo "### Download"
            echo ""
            echo "Latest compatible Pixel Camera was downloaded and SHA-256 verified on the ephemeral GitHub runner."
            echo "The proprietary APK/APKM is not committed to this repository."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install APK signature verifier
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.standalone.outputs.enabled == 'true' ||
          (github.event_name == 'schedule' && steps.selected.outputs.changed == 'true')
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "build-tools;35.0.0"

      - name: Audit downloaded Pixel Camera bundle
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.standalone.outputs.enabled == 'true' ||
          (github.event_name == 'schedule' && steps.selected.outputs.changed == 'true')
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE_PATH="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/pixel-camera-download.json"))["path"])')"
          EXPECTED_SIGNER="$(python -c 'import json; print(json.load(open("device/marble/apkm-audit-policy.json"))["allowed_signer_sha256"][0])')"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -perm -111 -print -quit)"
          REPORT="$RUNNER_TEMP/pixel-camera-audit.json"

          if [ -z "$APKANALYZER" ]; then
            echo "::error::apkanalyzer was not found in the Android SDK."
            exit 1
          fi

          python scripts/inspect_apkm.py "$PACKAGE_PATH" \
            --output "$REPORT" \
            --apksigner "$APKSIGNER" \
            --apkanalyzer "$APKANALYZER" \
            --zipalign "$ZIPALIGN" \
            --allowed-signer-sha256 "$EXPECTED_SIGNER" \
            --require-signature-verification >/dev/null

          python -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/pixel-camera-audit.json")); s=r["summary"]; sig=s["signature"]; out=open(os.environ["GITHUB_STEP_SUMMARY"],"a"); out.write("\\n### Pixel Camera APKM audit\\n\\n"); out.write("- APK/split count: %s\\n" % s["apk_count"]); out.write("- PairIP indicators: %s\\n" % s["pairip_detected"]); out.write("- All APK signatures verified: %s\\n" % sig["all_verified"]); out.write("- Consistent signer: %s\\n" % sig["consistent_signer"]); out.close()'

      - name: Validate split dependency graph
        if: >-
          github.event_name == 'workflow_dispatch' ||
          steps.standalone.outputs.enabled == 'true' ||
          (github.event_name == 'schedule' && steps.selected.outputs.changed == 'true')
        shell: bash
        run: |
          set -euo pipefail

          REPORT="$RUNNER_TEMP/pixel-camera-audit.json"
          PLAN="$RUNNER_TEMP/pixel-camera-split-plan.json"

          python scripts/plan_device_splits.py "$REPORT" --output "$PLAN" >/dev/null

          python - "$PLAN" <<'PY'
          import json
          import sys

          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          missing = int(plan.get("missing_dependency_count") or 0)
          if missing:
              raise SystemExit(
                  f"split dependency graph is incomplete: {missing} declared dependencies are missing"
              )
          PY

          echo "PIXEL_CAMERA_SPLIT_PLAN=$PLAN" >> "$GITHUB_ENV"

          python - "$PLAN" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          with open(sys.argv[2], "a", encoding="utf-8") as out:
              out.write("\n### Split dependency plan\n\n")
              out.write(
                  f"- Manifest metadata complete: `{plan['manifest_metadata_complete']}`\n"
              )
              out.write(
                  f"- Missing declared dependencies: `{plan['missing_dependency_count']}`\n"
              )
              out.write(
                  f"- Device-validation candidate bytes: `{plan['validation_candidate_bytes']}`\n"
              )
              out.write("- Automatic feature removal: `false`\n")
          PY

      - name: Upload original Google-signed Pixel Camera bundle
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'schedule' && steps.selected.outputs.changed == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: poco-f5-pixel-camera-original-splits-${{ steps.selected.outputs.version }}
          path: |
            ${{ env.PIXEL_CAMERA_SOURCE }}
            ${{ runner.temp }}/pixel-camera-audit.json
            ${{ env.PIXEL_CAMERA_SPLIT_PLAN }}
            scripts/install-pixel-camera-splits.ps1
            scripts/test-pixel-camera-runtime.ps1
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Verify pinned APKEditor and compile manifest helper
        shell: bash
        run: |
          set -euo pipefail

          readarray -t TOOL < <(python - <<'PY'
          import json
          policy = json.load(open("device/marble/standalone-apk-policy.json"))
          tool = policy["toolchain"]["apkeditor"]
          print(tool["url"])
          print(tool["sha256"])
          PY
          )
          URL="${TOOL[0]}"
          EXPECTED_SHA256="${TOOL[1]}"
          JAR="$RUNNER_TEMP/APKEditor.jar"
          CLASSES="$RUNNER_TEMP/opencl-manifest-helper-classes"

          curl --fail --location --silent --show-error --retry 3 \
            "$URL" --output "$JAR"
          echo "$EXPECTED_SHA256  $JAR" | sha256sum --check --strict

          HELP_OUTPUT="$(java -jar "$JAR" -h 2>&1 || true)"
          if ! grep -Fq "APKEditor - 1.4.9" <<< "$HELP_OUTPUT"; then
            echo "::error::Pinned APKEditor did not report the expected version."
            printf '%s\n' "$HELP_OUTPUT"
            exit 1
          fi

          rm -rf "$CLASSES"
          mkdir -p "$CLASSES"
          javac -cp "$JAR" -d "$CLASSES" tools/OpenClManifestPatcher.java

          echo "Verified APKEditor 1.4.9 checksum and compiled binary-manifest helper."
          echo "APKEDITOR_JAR=$JAR" >> "$GITHUB_ENV"

      - name: Download pinned smali toolchain
        if: >-
          steps.standalone.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          readarray -t TOOL < <(python - <<'PY'
          import json
          policy = json.load(open("device/marble/standalone-apk-policy.json"))
          tool = policy["toolchain"]["smali"]
          print(tool["version"])
          print(tool["baksmali_url"])
          print(tool["baksmali_sha256"])
          print(tool["smali_url"])
          print(tool["smali_sha256"])
          PY
          )

          VERSION="${TOOL[0]}"
          BAKSMALI_URL="${TOOL[1]}"
          BAKSMALI_SHA256="${TOOL[2]}"
          SMALI_URL="${TOOL[3]}"
          SMALI_SHA256="${TOOL[4]}"
          BAKSMALI_JAR="$RUNNER_TEMP/baksmali.jar"
          SMALI_JAR="$RUNNER_TEMP/smali.jar"

          curl --fail --location --silent --show-error --retry 3 "$BAKSMALI_URL" --output "$BAKSMALI_JAR"
          curl --fail --location --silent --show-error --retry 3 "$SMALI_URL" --output "$SMALI_JAR"
          echo "$BAKSMALI_SHA256  $BAKSMALI_JAR" | sha256sum --check --strict
          echo "$SMALI_SHA256  $SMALI_JAR" | sha256sum --check --strict

          BAKSMALI_HELP="$(java -jar "$BAKSMALI_JAR" --help 2>&1 || true)"
          SMALI_HELP="$(java -jar "$SMALI_JAR" --help 2>&1 || true)"
          if ! grep -qi "baksmali" <<< "$BAKSMALI_HELP"; then
            echo "::error::Pinned baksmali $VERSION did not expose the expected CLI."
            printf '%s\n' "$BAKSMALI_HELP"
            exit 1
          fi
          if ! grep -qi "smali" <<< "$SMALI_HELP"; then
            echo "::error::Pinned smali $VERSION did not expose the expected CLI."
            printf '%s\n' "$SMALI_HELP"
            exit 1
          fi

          echo "Verified smali/baksmali $VERSION checksums and CLI entry points."
          echo "BAKSMALI_JAR=$BAKSMALI_JAR" >> "$GITHUB_ENV"
          echo "SMALI_JAR=$SMALI_JAR" >> "$GITHUB_ENV"

      - name: Prepare standalone APK signing key
        if: >-
          steps.standalone.outputs.enabled == 'true'
        shell: bash
        env:
          SECRET_KEYSTORE_B64: ${{ secrets.GCMOD_KEYSTORE_B64 }}
          SECRET_KEY_ALIAS: ${{ secrets.GCMOD_KEY_ALIAS }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.GCMOD_KEYSTORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.GCMOD_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/poco-f5-gcam-signing.jks"

          if [ -n "${SECRET_KEYSTORE_B64:-}" ] &&
             [ -n "${SECRET_KEY_ALIAS:-}" ] &&
             [ -n "${SECRET_KEYSTORE_PASSWORD:-}" ] &&
             [ -n "${SECRET_KEY_PASSWORD:-}" ]; then
            printf '%s' "$SECRET_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
            KEY_ALIAS="$SECRET_KEY_ALIAS"
            KS_PASS="$SECRET_KEYSTORE_PASSWORD"
            KEY_PASS="$SECRET_KEY_PASSWORD"
            SIGNING_MODE="repository-keystore"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            KEY_ALIAS="poco-f5-ci"
            KS_PASS="poco-f5-ci-ephemeral"
            KEY_PASS="poco-f5-ci-ephemeral"
            SIGNING_MODE="ephemeral-ci"

            echo "::warning::Using an ephemeral signing key for pull-request validation only."
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storetype JKS \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -dname "CN=POCO F5 GCam CI, OU=Build, O=Community, C=DE" \
              -noprompt >/dev/null
          else
            echo "::error::Production standalone APK builds require the four GCMOD signing secrets so future APKs remain upgrade-compatible."
            exit 1
          fi

          test -s "$KEYSTORE"
          echo "::add-mask::$KS_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "GCMOD_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "GCMOD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GCMOD_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "GCMOD_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          echo "GCMOD_SIGNING_MODE=$SIGNING_MODE" >> "$GITHUB_ENV"

      - name: Build four Pixel Camera flavours
        if: >-
          steps.standalone.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          META="$RUNNER_TEMP/pixel-camera-download.json"
          SOURCE="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["path"])' "$META")"
          OUT_DIR="$RUNNER_TEMP/poco-f5-flavors"
          MANIFEST="$OUT_DIR/deliverables.json"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          mkdir -p "$OUT_DIR"

          python scripts/build_flavor_matrix.py \
            --pixel-source "$SOURCE" \
            --output-dir "$OUT_DIR" \
            --apkeditor "$APKEDITOR_JAR" \
            --baksmali "$BAKSMALI_JAR" \
            --smali "$SMALI_JAR" \
            --zipalign "$BUILD_TOOLS/zipalign" \
            --apksigner "$BUILD_TOOLS/apksigner" \
            --aapt2 "$BUILD_TOOLS/aapt2" \
            --keystore "$GCMOD_KEYSTORE_PATH" \
            --key-alias "$GCMOD_KEY_ALIAS" \
            --flavor pixel-a17 \
            --flavor pixel-a13 \
            --flavor pixel-manual-a17 \
            --flavor pixel-manual-a13 \
            --signing-mode "$GCMOD_SIGNING_MODE" \
            --manifest "$MANIFEST" \
            --json > "$RUNNER_TEMP/flavor-matrix.json"

          test -s "$MANIFEST"

          for report in "$OUT_DIR"/*.build.json; do
            test -s "$report"
          done
          for apk in "$OUT_DIR"/*.apk; do
            test -s "$apk"
          done

          # The original bundle is no longer needed after all four outputs
          # have been verified. Free runner disk before the artifact upload and
          # Telegram delivery copy the large APKs.
          rm -f "$SOURCE"

          echo "STANDALONE_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          echo "DELIVERABLES_MANIFEST=$MANIFEST" >> "$GITHUB_ENV"

          python - "$MANIFEST" "$GITHUB_STEP_SUMMARY" "$GCMOD_SIGNING_MODE" <<'PY'
          import json
          import os
          import sys

          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          signing_mode = sys.argv[3]
          lines = [
              "",
              "### POCO F5 camera flavour set",
              "",
              f"- Pixel Camera upstream: `{manifest.get('pixel_camera_version')}`",
              f"- Flavours: `{len(manifest['flavors'])}`",
              "",
              "| Flavour | File | Size | SHA-256 | Package | Min API | Signing | Runtime |",
              "|---|---|---:|---|---|---:|---|---|",
          ]
          for entry in manifest["flavors"]:
              lines.append(
                  "| `{id}` | `{file}` | {size} | `{sha}` | `{package}` | {min_sdk} | `{signing}` | `{runtime}` |".format(
                      id=entry["id"],
                      file=os.path.basename(entry["apk"]),
                      size=entry["size_bytes"],
                      sha=entry["sha256"],
                      package=entry["package_name"],
                      min_sdk=entry["min_sdk"],
                      signing=entry["signing_mode"],
                      runtime=entry["runtime_validation"],
                  )
              )
          lines.extend(
              [
                  "",
                  f"- Pixel Camera signing mode: `{signing_mode}`",
                  "- All four are Pixel Camera 11.1 compatibility builds: `compatibility-patched-unvalidated`; on-device runtime validation `NOT RUN`.",
                  "- The two manual-controls flavours add a clean-room, `marble`-gated wrapper for focus, shutter, ISO, and lens selection; no third-party code, ads, or branding is added.",
                  "- Distribution remains blocked for stable promotion until real-device runtime validation passes.",
                  "",
              ]
          )
          with open(sys.argv[2], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY

      - name: Upload camera flavour artifacts
        if: >-
          steps.standalone.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: poco-f5-camera-flavors-${{ steps.selected.outputs.version }}
          path: |
            ${{ env.STANDALONE_DIR }}/*.apk
            ${{ env.STANDALONE_DIR }}/*.json
            ${{ env.PIXEL_CAMERA_SPLIT_PLAN }}
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Prepare official Telegram Bot API source
        # Owner-requested experimental delivery; runtime validation stays pending.
        id: telegram-source
        if: >-
          steps.standalone.outputs.enabled == 'true' &&
          github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          SRC="$RUNNER_TEMP/telegram-bot-api-src"
          SOURCE_SHA="$(python -c 'import json; print(json.load(open("device/marble/standalone-apk-policy.json"))["toolchain"]["telegram_bot_api"]["source_sha"])')"
          rm -rf "$SRC"
          git init -q "$SRC"
          git -C "$SRC" remote add origin https://github.com/tdlib/telegram-bot-api.git
          git -C "$SRC" fetch --depth 1 origin "$SOURCE_SHA"
          git -C "$SRC" checkout -q --detach FETCH_HEAD
          git -C "$SRC" submodule update --init --recursive --depth 1

          ACTUAL_SHA="$(git -C "$SRC" rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::Telegram Bot API source pin mismatch."
            exit 1
          fi
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Telegram Bot API source: $SOURCE_SHA"

      - name: Restore Telegram Bot API binary cache
        id: telegram-cache
        if: >-
          steps.standalone.outputs.enabled == 'true' &&
          github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/telegram-bot-api-bin
          key: telegram-bot-api-${{ runner.os }}-${{ steps.telegram-source.outputs.sha }}

      - name: Build official Telegram Local Bot API server
        if: >-
          (
            steps.standalone.outputs.enabled == 'true' &&
            github.ref == 'refs/heads/main'
          ) &&
          steps.telegram-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gperf libssl-dev zlib1g-dev

          SRC="$RUNNER_TEMP/telegram-bot-api-src"
          BIN_DIR="$RUNNER_TEMP/telegram-bot-api-bin"
          rm -rf "$SRC/build"
          mkdir -p "$BIN_DIR"

          cmake -S "$SRC" -B "$SRC/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$SRC/build" --target telegram-bot-api --parallel "$(nproc)"

          BIN="$(find "$SRC/build" -type f -name telegram-bot-api -perm -111 -print -quit)"
          if [ -z "$BIN" ] || [ ! -x "$BIN" ]; then
            echo "::error::telegram-bot-api binary was not produced."
            exit 1
          fi

          install -m 0755 "$BIN" "$BIN_DIR/telegram-bot-api"

      - name: Save Telegram Bot API binary cache
        if: >-
          (
            steps.standalone.outputs.enabled == 'true' &&
            github.ref == 'refs/heads/main'
          ) &&
          steps.telegram-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/telegram-bot-api-bin
          key: telegram-bot-api-${{ runner.os }}-${{ steps.telegram-source.outputs.sha }}

      - name: Select Telegram Bot API binary
        if: >-
          steps.standalone.outputs.enabled == 'true' &&
          github.ref == 'refs/heads/main'
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.telegram-source.outputs.sha }}
        run: |
          set -euo pipefail

          BIN="$RUNNER_TEMP/telegram-bot-api-bin/telegram-bot-api"
          if [ ! -x "$BIN" ]; then
            echo "::error::Cached/built telegram-bot-api binary is missing."
            exit 1
          fi

          echo "TELEGRAM_BOT_API_BIN=$BIN" >> "$GITHUB_ENV"
          echo "TELEGRAM_BOT_API_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Deliver POCO F5 camera flavours through Local Bot API
        if: >-
          steps.standalone.outputs.enabled == 'true' &&
          github.ref == 'refs/heads/main'
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          DELIVER_FLAVORS: ${{ inputs.deliver_flavors }}
        run: |
          set -euo pipefail

          for name in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID TELEGRAM_API_ID TELEGRAM_API_HASH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Telegram delivery requires $name."
              exit 1
            fi
          done

          TELEGRAM_BOT_TOKEN="$(printf '%s' "$TELEGRAM_BOT_TOKEN" | tr -d '\r\n')"
          TELEGRAM_CHAT_ID="$(printf '%s' "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')"
          TELEGRAM_API_ID="$(printf '%s' "$TELEGRAM_API_ID" | tr -d '[:space:]')"
          TELEGRAM_API_HASH="$(printf '%s' "$TELEGRAM_API_HASH" | tr -d '[:space:]')"
          export TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID TELEGRAM_API_ID TELEGRAM_API_HASH

          if ! [[ "$TELEGRAM_API_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::TELEGRAM_API_ID must contain digits only."
            exit 1
          fi
          if ! [[ "$TELEGRAM_API_HASH" =~ ^[0-9A-Fa-f]{32}$ ]]; then
            echo "::error::TELEGRAM_API_HASH must be a 32-character hexadecimal api_hash."
            exit 1
          fi

          # Telegram Local Bot API documents a 2000 MB upload limit. Keep the
          # guard at 2000 MiB so oversized APKs fail before a long upload.
          TELEGRAM_MAX_BYTES=$((2000 * 1024 * 1024))

          ONLY_ARGS=()
          if [ -n "${DELIVER_FLAVORS:-}" ]; then
            IFS=',' read -r -a ONLY_IDS <<< "$DELIVER_FLAVORS"
            for flavor_id in "${ONLY_IDS[@]}"; do
              flavor_id="$(printf '%s' "$flavor_id" | tr -d '[:space:]')"
              [ -z "$flavor_id" ] && continue
              ONLY_ARGS+=(--only "$flavor_id")
            done
          fi

          curl --silent --show-error --max-time 30 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/logOut" \
            > "$RUNNER_TEMP/telegram-cloud-logout.json" || true

          RUNTIME="$RUNNER_TEMP/telegram-bot-api-runtime"
          mkdir -p "$RUNTIME"
          cd "$RUNTIME"

          "$TELEGRAM_BOT_API_BIN" \
            --api-id="$TELEGRAM_API_ID" \
            --api-hash="$TELEGRAM_API_HASH" \
            --local \
            --http-ip-address=127.0.0.1 \
            --http-port=8081 \
            > "$RUNNER_TEMP/telegram-bot-api.log" 2>&1 &
          TG_PID=$!

          cleanup() {
            curl --silent --max-time 15 \
              "http://127.0.0.1:8081/bot${TELEGRAM_BOT_TOKEN}/logOut" \
              >/dev/null 2>&1 || true
            kill "$TG_PID" >/dev/null 2>&1 || true
            wait "$TG_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          READY=false
          for attempt in $(seq 1 90); do
            if ! kill -0 "$TG_PID" >/dev/null 2>&1; then
              echo "::error::Telegram Bot API server exited before becoming ready."
              cat "$RUNNER_TEMP/telegram-bot-api.log" || true
              exit 1
            fi

            if curl --silent --show-error --max-time 5 \
              "http://127.0.0.1:8081/bot${TELEGRAM_BOT_TOKEN}/getMe" \
              > "$RUNNER_TEMP/telegram-getme.json"; then
              if python - "$RUNNER_TEMP/telegram-getme.json" <<'PY'
          import json
          import sys
          try:
              response = json.load(open(sys.argv[1], encoding="utf-8"))
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if response.get("ok") is True else 1)
          PY
              then
                READY=true
                break
              fi
            fi
            sleep 1
          done

          if [ "$READY" != true ]; then
            echo "::error::Telegram Local Bot API did not become ready."
            cat "$RUNNER_TEMP/telegram-bot-api.log" || true
            exit 1
          fi

          python "$GITHUB_WORKSPACE/scripts/send_telegram_deliverables.py" \
            --manifest "$DELIVERABLES_MANIFEST" \
            --api-url "http://127.0.0.1:8081" \
            --max-bytes "$TELEGRAM_MAX_BYTES" \
            --timeout 1800 \
            "${ONLY_ARGS[@]}"

          python - "$DELIVERABLES_MANIFEST" "$GITHUB_STEP_SUMMARY" "$TELEGRAM_BOT_API_SOURCE_SHA" <<'PY'
          import json
          import os
          import sys

          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          only = {
              value.strip()
              for value in os.environ.get("DELIVER_FLAVORS", "").split(",")
              if value.strip()
          }
          entries = manifest["flavors"]
          if only:
              entries = [entry for entry in entries if entry["id"] in only]
          lines = [
              "",
              "### Telegram camera flavour delivery",
              "",
          ]
          for entry in entries:
              lines.append(
                  "- `{id}`: `{file}` — {size} bytes — `{sha}`".format(
                      id=entry["id"],
                      file=os.path.basename(entry["apk"]),
                      size=entry["size_bytes"],
                      sha=entry["sha256"],
                  )
              )
          lines.extend(
              [
                  f"- Delivery: Telegram Local Bot API (source `{sys.argv[3]}`)",
                  "- Single-file limit: `2000 MiB`",
                  "",
              ]
          )
          with open(sys.argv[2], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY

      - name: Upload Pixel Camera audit report
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'schedule' && steps.selected.outputs.changed == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: pixel-camera-audit-${{ steps.selected.outputs.version }}
          path: ${{ runner.temp }}/pixel-camera-audit.json
          if-no-files-found: error

      - name: Commit selected-version lock update
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- device/marble/upstream/pixel-camera.json; then
            echo "Already tracking the newest compatible Pixel Camera."
            exit 0
          fi

          VERSION="${{ steps.selected.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add device/marble/upstream/pixel-camera.json
          git commit -m "chore(upstream): select Pixel Camera ${VERSION}"
          git push
