name: Pixel Camera sensor ID metadata diagnostics

on:
  push:
    paths:
      - ".github/workflows/sensor-id-metadata-diagnostics.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download selected Pixel Camera bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pixel-camera"
          python scripts/download_latest_pixel_camera.py \
            --lock device/marble/upstream/pixel-camera.json \
            --output-dir "$RUNNER_TEMP/pixel-camera" \
            --json > "$RUNNER_TEMP/pixel-camera-download.json"
          PACKAGE_PATH="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/pixel-camera-download.json"))["path"])')"
          echo "PIXEL_CAMERA_SOURCE=$PACKAGE_PATH" >> "$GITHUB_ENV"

      - name: Download pinned baksmali
        shell: bash
        run: |
          set -euo pipefail
          readarray -t TOOL < <(python - <<'PY'
          import json
          p=json.load(open("device/marble/standalone-apk-policy.json"))["toolchain"]["smali"]
          print(p["baksmali_url"])
          print(p["baksmali_sha256"])
          PY
          )
          curl --fail --location --silent --show-error --retry 3 "${TOOL[0]}" -o "$RUNNER_TEMP/baksmali.jar"
          echo "${TOOL[1]}  $RUNNER_TEMP/baksmali.jar" | sha256sum --check --strict

      - name: Locate StaticMetadata sensor ID callsites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sensor-dex"
          python - "$PIXEL_CAMERA_SOURCE" "$RUNNER_TEMP/sensor-dex" <<'PY'
          import io, json, re, sys, zipfile
          from pathlib import Path

          package=Path(sys.argv[1]); out=Path(sys.argv[2])
          needles=[
              b"StaticMetadata_sensor_id_set",
              b"StaticMetadata_sensor_id_get",
              b"StaticMetadataVector",
          ]
          dex_re=re.compile(r"^classes(?:\d+)?\.dex$")
          matches=[]
          def scan_zip(z, container):
              for info in z.infolist():
                  if not dex_re.fullmatch(info.filename):
                      continue
                  data=z.read(info)
                  found=[n.decode() for n in needles if n in data]
                  if "StaticMetadata_sensor_id_set" not in found:
                      continue
                  matches.append((container,info.filename,data,found))
          with zipfile.ZipFile(package) as outer:
              scan_zip(outer, package.name)
              for info in outer.infolist():
                  if not info.filename.lower().endswith(".apk"):
                      continue
                  raw=outer.read(info)
                  if not zipfile.is_zipfile(io.BytesIO(raw)):
                      continue
                  with zipfile.ZipFile(io.BytesIO(raw)) as nested:
                      scan_zip(nested, info.filename)
          manifest=[]
          for i,(container,dex,data,found) in enumerate(matches):
              path=out/f"sensor-{i}.dex"
              path.write_bytes(data)
              manifest.append({"index":i,"container":container,"dex":dex,"size":len(data),"symbols":found})
          (out/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print((out/"manifest.json").read_text())
          if not matches:
              raise SystemExit("no dex contains StaticMetadata_sensor_id_set")
          PY

          REPORT="$RUNNER_TEMP/sensor-id-metadata.txt"
          : > "$REPORT"
          for DEX in "$RUNNER_TEMP"/sensor-dex/sensor-*.dex; do
            NAME="$(basename "$DEX" .dex)"
            OUT="$RUNNER_TEMP/$NAME-smali"
            java -jar "$RUNNER_TEMP/baksmali.jar" d "$DEX" -o "$OUT"
            {
              echo "=== $NAME: StaticMetadata_sensor_id_set callsites ==="
              grep -R -n -B 70 -A 100 -F "StaticMetadata_sensor_id_set" "$OUT" || true
              echo
              echo "=== $NAME: StaticMetadata sensor-ID related calls ==="
              grep -R -n -B 35 -A 60 -E "StaticMetadata_.*sensor|sensor_id" "$OUT" || true
              echo
              echo "=== $NAME: StaticMetadata.u(zoi) callsites ==="
              grep -R -n -B 90 -A 120 -F "Lcom/google/googlex/gcam/StaticMetadata;->u(Lzoi;)V" "$OUT" || true
              echo
              echo "=== $NAME: zoi.z sensor-ID field reads/writes ==="
              grep -R -n -B 90 -A 120 -F "Lzoi;->z:I" "$OUT" || true
              echo
            } >> "$REPORT"
          done
          python - "$RUNNER_TEMP/sensor-0-smali" "$REPORT" <<'PY'
          import re, sys
          from pathlib import Path

          root=Path(sys.argv[1]); report=Path(sys.argv[2])

          def methods(path):
              lines=path.read_text(encoding="utf-8",errors="replace").splitlines()
              result=[]
              i=0
              while i < len(lines):
                  if not lines[i].startswith(".method "):
                      i+=1
                      continue
                  start=i
                  while i < len(lines) and lines[i].strip()!=".end method":
                      i+=1
                  end=min(i,len(lines)-1)
                  result.append((lines[start],start,end,lines[start:end+1]))
                  i+=1
              return lines,result

          with report.open("a",encoding="utf-8") as out:
              zoi_path=root/"zoi.smali"
              if zoi_path.is_file():
                  lines,ms=methods(zoi_path)
                  out.write("\n=== zoi fields ===\n")
                  for i,line in enumerate(lines):
                      if line.startswith(".field "):
                          out.write(f"{i+1:06d}: {line}\n")
                  for sig,s,e,body in ms:
                      if "<clinit>()V" in sig or "<init>(" in sig:
                          out.write(f"\n=== zoi method {s+1}-{e+1}: {sig} ===\n")
                          out.write("\n".join(f"{s+i+1:06d}: {line}" for i,line in enumerate(body))+"\n")

              mjt_path=root/"mjt.smali"
              if mjt_path.is_file():
                  _,ms=methods(mjt_path)
                  wanted=(
                      " f(Lcom/google/googlex/gcam/StaticMetadata;Lklm;Lnoe;)Lzoi;",
                      " d(Lzoi;Lcom/google/googlex/gcam/StaticMetadata;ILuus;Lklm;)Lcom/google/googlex/gcam/StaticMetadata;",
                  )
                  for sig,s,e,body in ms:
                      if any(token in sig for token in wanted):
                          out.write(f"\n=== mjt method {s+1}-{e+1}: {sig} ===\n")
                          out.write("\n".join(f"{s+i+1:06d}: {line}" for i,line in enumerate(body))+"\n")

              sm_path=root/"com/google/googlex/gcam/StaticMetadata.smali"
              if sm_path.is_file():
                  _,ms=methods(sm_path)
                  for sig,s,e,body in ms:
                      if " g()Lzoi;" in sig or " u(Lzoi;)V" in sig:
                          out.write(f"\n=== StaticMetadata method {s+1}-{e+1}: {sig} ===\n")
                          out.write("\n".join(f"{s+i+1:06d}: {line}" for i,line in enumerate(body))+"\n")
          PY

          sed -n '1,4200p' "$REPORT"

      - name: Upload sensor ID diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: pixel-camera-sensor-id-metadata-diagnostics
          path: |
            ${{ runner.temp }}/sensor-dex/manifest.json
            ${{ runner.temp }}/sensor-id-metadata.txt
          if-no-files-found: error
          retention-days: 7
