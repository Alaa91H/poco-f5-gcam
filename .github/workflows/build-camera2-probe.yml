name: Build Camera2 probe

on:
  push:
    paths:
      - "tools/camera2-probe/**"
      - ".github/workflows/build-camera2-probe.yml"
  pull_request:
    paths:
      - "tools/camera2-probe/**"
      - ".github/workflows/build-camera2-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          fi

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDKMANAGER=$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build and lint debug APK
        shell: bash
        run: |
          gradle -p tools/camera2-probe :app:assembleDebug :app:lintDebug --stacktrace

      - name: Send debug APK to Telegram
        if: success() && github.event_name != 'pull_request'
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          APK_PATH="tools/camera2-probe/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            exit 1
          fi

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "::error::Missing GitHub Actions secret: TELEGRAM_BOT_TOKEN"
            exit 1
          fi

          if [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::error::Missing GitHub Actions secret: TELEGRAM_CHAT_ID"
            exit 1
          fi

          CAPTION="✅ Build succeeded
Repository: ${GITHUB_REPOSITORY}
Branch: ${GITHUB_REF_NAME}
Commit: ${GITHUB_SHA:0:7}"

          curl --silent --show-error --fail-with-body --retry 3 \
            --request POST \
            --url "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form "chat_id=${TELEGRAM_CHAT_ID}" \
            --form "document=@${APK_PATH};type=application/vnd.android.package-archive" \
            --form "caption=${CAPTION}"

          echo "APK sent to Telegram successfully."
