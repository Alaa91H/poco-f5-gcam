name: Build Camera2 probe

on:
  push:
    paths:
      - "tools/camera2-probe/**"
      - ".github/workflows/build-camera2-probe.yml"
  pull_request:
    paths:
      - "tools/camera2-probe/**"
      - ".github/workflows/build-camera2-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build and lint debug APK
        shell: bash
        run: |
          gradle -p tools/camera2-probe :app:assembleDebug :app:lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: camera2-probe-debug
          path: tools/camera2-probe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
