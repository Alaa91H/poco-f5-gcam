name: Pixel Camera native tuning diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/native-tuning-diagnostics.yml"
      - "scripts/analyze_pixel_camera_native.py"
      - "scripts/patch_pixel_camera_device_gate.py"
      - "tests/test_analyze_pixel_camera_native.py"

permissions:
  contents: read

concurrency:
  group: pixel-camera-native-tuning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze libgcam tuning control flow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate native analyzer
        run: |
          python -m unittest tests.test_analyze_pixel_camera_native -v
          python -m unittest tests.test_patch_pixel_camera_device_gate -v

      - name: Download selected Pixel Camera bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pixel-camera"

          python scripts/download_latest_pixel_camera.py \
            --lock device/marble/upstream/pixel-camera.json \
            --output-dir "$RUNNER_TEMP/pixel-camera" \
            --json | tee "$RUNNER_TEMP/pixel-camera-download.json"

          PACKAGE_PATH="$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/pixel-camera-download.json"))["path"])')"
          echo "PIXEL_CAMERA_SOURCE=$PACKAGE_PATH" >> "$GITHUB_ENV"

      - name: Analyze libgcastartup tuning paths
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/pixel-camera-native-tuning.json"

          python scripts/analyze_pixel_camera_native.py \
            --input "$PIXEL_CAMERA_SOURCE" \
            --output "$REPORT" \
            >/dev/null

          python - "$REPORT" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          tuning = report["tuning"]
          strings = tuning["strings"]

          with open(sys.argv[2], "a", encoding="utf-8") as out:
              out.write("### Native libgcam tuning diagnostics\n\n")
              out.write(f"- Library: `{report['library']['nested_apk'] or report['library']['container']}`\n")
              out.write(f"- libgcastartup SHA-256: `{report['library']['sha256']}`\n")
              out.write("- Tuning modifications: `false`\n")
              out.write("- Profile spoof: `false`\n")
              for marker, entry in strings.items():
                  xrefs = sum(
                      len(
                          item.get("resolved_xref_offsets")
                          or item.get("xref_offsets")
                          or []
                      )
                      for item in entry.get("occurrences") or []
                  )
                  out.write(
                      f"- `{marker}`: occurrences={entry['count']}, xrefs={xrefs}\n"
                  )
          PY

          cat "$REPORT"

      - name: Disassemble tuning decision regions
        shell: bash
        run: |
          set -euo pipefail

          LIB="$RUNNER_TEMP/libgcastartup.so"
          OUT="$RUNNER_TEMP/pixel-camera-native-tuning-disassembly.txt"

          python - "$PIXEL_CAMERA_SOURCE" "$LIB" <<'PY'
          import sys
          from pathlib import Path
          from scripts.analyze_pixel_camera_native import find_native_library

          data, _ = find_native_library(Path(sys.argv[1]))
          Path(sys.argv[2]).write_bytes(data)
          PY

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu >/dev/null
          DISASM="$(command -v aarch64-linux-gnu-objdump)"
          test -x "$DISASM"

          {
            echo "tool=$DISASM"
            echo
            echo "=== unknown-device uncalibrated/abort decision ==="
            "$DISASM" -d --start-address=0x69244a0 --stop-address=0x6924cc0 "$LIB"
            echo
            echo "=== failed tuning / abort region ==="
            "$DISASM" -d --start-address=0x691be80 --stop-address=0x691c300 "$LIB"
            echo
            echo "=== tuning defaults region ==="
            "$DISASM" -d --start-address=0x6e3f800 --stop-address=0x6e3fc80 "$LIB"
            echo
            echo "=== AION / lib_aion_buffer reference regions ==="
            python - "$RUNNER_TEMP/pixel-camera-native-tuning.json" "$LIB" <<'PY'
          import json
          import struct
          import sys

          from scripts.patch_pixel_camera_device_gate import _elf64_load_segments

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          data = open(sys.argv[2], "rb").read()
          segments = _elf64_load_segments(data)

          def file_offset_to_vaddr(offset):
              for segment in segments:
                  start = segment["offset"]
                  end = start + segment["filesz"]
                  if start <= offset < end:
                      return segment["vaddr"] + (offset - start)
              return None

          markers = ("lib_aion_buffer.so", "aion_context.cc", "Check failed: valid_")
          seen = set()
          for marker in markers:
              entry = report["tuning"]["strings"].get(marker) or {}
              for occurrence in entry.get("occurrences") or []:
                  print(f"marker={marker!r}")
                  print(f"context={occurrence.get('c_string_context')!r}")
                  for rendered in occurrence.get("resolved_xref_offsets") or []:
                      file_offset = int(rendered, 16)
                      vaddr = file_offset_to_vaddr(file_offset)
                      if vaddr is None or vaddr in seen:
                          continue
                      seen.add(vaddr)
                      print(f"xref_file_offset=0x{file_offset:x} xref_vaddr=0x{vaddr:x}")
          PY

            python - "$RUNNER_TEMP/pixel-camera-native-tuning.json" "$LIB" "$DISASM" <<'PY'
          import json
          import subprocess
          import sys

          from scripts.patch_pixel_camera_device_gate import _elf64_load_segments

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          lib = sys.argv[2]
          disasm = sys.argv[3]
          data = open(lib, "rb").read()
          segments = _elf64_load_segments(data)

          def file_offset_to_vaddr(offset):
              for segment in segments:
                  start = segment["offset"]
                  end = start + segment["filesz"]
                  if start <= offset < end:
                      return segment["vaddr"] + (offset - start)
              return None

          seen = set()
          for marker in ("lib_aion_buffer.so", "aion_context.cc", "Check failed: valid_"):
              entry = report["tuning"]["strings"].get(marker) or {}
              for occurrence in entry.get("occurrences") or []:
                  for rendered in occurrence.get("resolved_xref_offsets") or []:
                      file_offset = int(rendered, 16)
                      vaddr = file_offset_to_vaddr(file_offset)
                      if vaddr is None or vaddr in seen:
                          continue
                      seen.add(vaddr)
                      start = max(0, vaddr - 0x100)
                      stop = vaddr + 0x180
                      print(
                          f"--- {marker} @ file 0x{file_offset:x}, va 0x{vaddr:x} ---"
                      )
                      subprocess.run(
                          [
                              disasm,
                              "-d",
                              f"--start-address=0x{start:x}",
                              f"--stop-address=0x{stop:x}",
                              lib,
                          ],
                          check=True,
                      )
          PY
          } > "$OUT"

          sed -n '1,720p' "$OUT"

      - name: Upload tuning disassembly
        uses: actions/upload-artifact@v7
        with:
          name: pixel-camera-native-tuning-disassembly
          path: ${{ runner.temp }}/pixel-camera-native-tuning-disassembly.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload tuning diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: pixel-camera-native-tuning-diagnostics
          path: ${{ runner.temp }}/pixel-camera-native-tuning.json
          if-no-files-found: error
          retention-days: 14
