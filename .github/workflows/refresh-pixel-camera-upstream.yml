name: Refresh Pixel Camera upstream

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/resolve_apkmirror_gcam.py"
      - "tests/test_resolve_apkmirror_gcam.py"
      - "device/marble/upstream-policy.json"
      - ".github/workflows/refresh-pixel-camera-upstream.yml"

permissions:
  contents: write

concurrency:
  group: pixel-camera-upstream
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test resolver
        run: python -m unittest discover -s tests -p "test_resolve_apkmirror_gcam.py" -v

      - name: Resolve newest compatible Pixel Camera
        if: github.event_name != 'pull_request'
        run: |
          python scripts/resolve_apkmirror_gcam.py \
            --policy device/marble/upstream-policy.json \
            --output device/marble/upstream/pixel-camera.json

      - name: Commit upstream lock update
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- device/marble/upstream/pixel-camera.json; then
            echo "Already on the newest compatible Pixel Camera release."
            exit 0
          fi

          VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("device/marble/upstream/pixel-camera.json").read_text())
          print(data["selected"]["version"])
          PY
          )"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add device/marble/upstream/pixel-camera.json
          git commit -m "chore(upstream): track Pixel Camera ${VERSION}"
          git push
