name: Dispatch Camera2 source diagnostic build once

on:
  push:
    paths:
      - ".github/workflows/dispatch-camera-source-diagnostic-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch experimental standalone build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f build_experimental_standalone=true
