name: Cancel redundant alias-filter run once

on:
  push:
    paths:
      - ".github/workflows/cancel-redundant-alias-run.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel redundant build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run cancel 36244074716 --repo "$GITHUB_REPOSITORY" || true
