name: Force-cancel redundant alias-filter run once

on:
  push:
    paths:
      - ".github/workflows/force-cancel-redundant-run.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force-cancel redundant build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/runs/36244074716/force-cancel"
