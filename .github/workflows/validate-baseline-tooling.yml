name: Validate PowerShell tooling

on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/validate-baseline-tooling.yml"
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/validate-baseline-tooling.yml"

permissions:
  contents: read

jobs:
  powershell-syntax:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse all PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false

          Get-ChildItem -Path (Join-Path $PWD "scripts") -Filter "*.ps1" -File -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null

            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $failed = $true
              foreach ($error in $errors) {
                Write-Error ("{0}:{1}:{2}: {3}" -f $_.FullName, $error.Extent.StartLineNumber, $error.Extent.StartColumnNumber, $error.Message)
              }
            }
            else {
              Write-Host ("PASS: {0}" -f $_.FullName)
            }
          }

          if ($failed) {
            exit 1
          }

          Write-Host "All PowerShell scripts passed syntax validation."
